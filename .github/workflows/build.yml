name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v0.1.0), created on the run commit'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          # No signing certificate: macOS builds are ad-hoc signed, Windows builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke.cjs
      - name: Smoke test the packaged app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: vi3ecode-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Installers only; the smoke screenshots stay in the run's artifacts.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          generate_release_notes: true
          # A manual run names its tag; the action creates it on this commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
